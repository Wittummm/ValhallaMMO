steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # THIS STEP FIXES THE JITPACK ERROR
      - name: Manually Install Broken Dependencies
        run: |
          # Download Vault directly from GitHub
          curl -L -o vault.jar https://github.com/MilkBowl/VaultAPI/releases/download/1.7.1/VaultAPI-1.7.1.jar
          mvn install:install-file -Dfile=vault.jar -DgroupId=com.github.MilkBowl -DartifactId=VaultAPI -Dversion=1.7.1 -Dpackaging=jar
          
          # Download DecentHolograms directly from GitHub
          curl -L -o dh.jar https://github.com/decentsoftware-eu/decentholograms/releases/download/2.8.5/DecentHolograms-2.8.5.jar
          mvn install:install-file -Dfile=dh.jar -DgroupId=com.github.decentsoftware-eu -DartifactId=decentholograms -Dversion=2.8.5 -Dpackaging=jar

      - name: Build with Maven
        # We use -o (offline mode) to force it to use the files we just installed
        run: mvn -B package -o -pl :valhallammo-core -am

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Valhalla-Fixed-Build
          path: "**/target/*.jar"
